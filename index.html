    <script>
      (function() {
        // Pre-boot lock on right click and devtools shortcuts
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
        window.addEventListener('keydown', function(e) {
          if (e.keyCode === 123 || (e.ctrlKey || e.metaKey) && (e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67) || e.keyCode === 85 || e.keyCode === 83)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
